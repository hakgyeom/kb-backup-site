<!doctype html><meta charset="utf-8"><title>kb-backup 개인정보처리방침</title>
<h1>개인정보처리방침</h1>
<p>이 앱은 사용자 본인의 Google Drive에서 이 앱이 만든 파일만 읽고 씁니다(범위 drive.file). 그 밖의 Google 사용자 데이터에 접근하지 않습니다.</p>
<p>수집하거나 보관하거나 제3자에게 주는 개인정보가 없습니다. 올리는 파일은 사용자의 컴퓨터에서 암호화된 백업입니다.</p>
<p>문의는 Google 동의 화면에 적힌 지원 이메일로 받습니다.</p>
